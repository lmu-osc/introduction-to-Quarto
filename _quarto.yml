# Begin Project
project:
  type: tutorial-template
  # FYI: the tutorial-template project type is defined in the lmu-osc/tutorial-template extension
  brand: brand.yml
  resources:
    - "gt.html"
    - "lib"
    - "downloadable"
# End Project

# Begin Website
repo-url: https://github.com/lmu-osc/introduction-to-Quarto
website:
  title: "Introduction to Quarto"
  page-footer:
    border: false
    center: © 2024 Florian Pargent, Florian Kohrt, Phillip Sckopke. Published by LMU Open Science Center. Licensed under CC BY-SA 4.0.
  repo-url: https://github.com/lmu-osc/introduction-to-Quarto

  navbar:
    right:
      - about.qmd
    left:
      - href: index.qmd
        text: Home
    tools:
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/lmu-osc/introduction-to-Quarto
          - text: Report a Bug
            href: https://github.com/lmu-osc/introduction-to-Quarto/issues
      - icon: house-heart
        url: https://www.osc.lmu.de/

  sidebar:
    style: "docked"
    contents:
      - text: "Overview"
        href: index.qmd
      - section: "Quarto Tutorials"
        href: quarto-tutorials.qmd
        contents:
          - preparations.qmd
          - tutorial-hello-quarto.qmd
          - tutorial-computations.qmd
          - tutorial-authoring.qmd
      - text: "Tips and Comments"
        href: comments.qmd
      - section: "Advanced Exercises"
        href: quarto-exercises.qmd
        contents:
          - webr.qmd
          - slideshow.qmd
          - apa7-manuscript.qmd
          - quarto-manuscripts.qmd
      - text: "Links"
        href: links.qmd
# End Website

# Begin Includes
include-in-header:
  - file: matomo-analytics.html
# End Includes

# Begin Format
# use only if needed. the default format for `tutorial-template` projects is tutorial-template-html+tutorial
# we recommend just extending the definition below if you need to make format changes
format:
  tutorial-template-html+tutorial:
    css:
      - footer/footer-style.css
    include-after-body:
      - file: footer/footer.html
    df-print: paged
    link-external-filter: ^(?:http:|https:)\/\/lmu-osc\.github\.io\/introduction-to-Quarto\/
# End Format

# Begin Editor
editor: source
# End Editor

from: markdown+emoji
bibliography: references.bib
